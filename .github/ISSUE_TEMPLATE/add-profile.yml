name: Add yourself to the directory
description: Ask for help creating your own approved public profile.
title: "Add profile: "
labels: ["profile submission"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for your own public profile. This issue and its replies are public. Do not include private contact details, unpublished information, or a photo unless it is already public and you have the right to share it. A maintainer reviews the issue, replies here, and makes a pull request. You must approve the final public text before publication. No response time is promised.
  - type: input
    id: slug
    attributes:
      label: slug
      description: Lower-case letters, numbers, and hyphens only. This becomes data/people/<slug>.json.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: name
      description: Your approved public name for the directory.
    validations:
      required: true
  - type: input
    id: headline
    attributes:
      label: headline
      description: A short, approved public description of your work, from 2 to 70 characters.
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: bio
      description: Approved public profile text only. Do not include private information.
    validations:
      required: true
  - type: dropdown
    id: work_mode
    attributes:
      label: workMode
      options:
        - in-house
        - independent
        - both
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: organisation
      description: Optional. Include only a current organisation reference that you approve.
  - type: textarea
    id: capabilities
    attributes:
      label: capabilities
      description: List the controlled capability values you want reviewed.
    validations:
      required: true
  - type: input
    id: cause_areas
    attributes:
      label: Areas of work
      description: Optional. Name your cause areas or support function. A maintainer will suggest directory groups for your review.
  - type: input
    id: network
    attributes:
      label: Network or programme
      description: Optional. For an AIM charity, state the Charity Entrepreneurship incubation connection and a public source.
  - type: checkboxes
    id: conversation_contact
    attributes:
      label: Conversation contact
      options:
        - label: My public contact route can be listed for conversations about AI uplift, separately from paid-work availability.
  - type: dropdown
    id: availability
    attributes:
      label: availability
      description: Choose the current public availability label.
      options:
        - available
        - peer-exchange
        - limited
        - unavailable
        - unknown
    validations:
      required: true
  - type: input
    id: availability_checked
    attributes:
      label: availabilityChecked
      description: YYYY-MM-DD.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: site
      description: Optional public HTTPS URL. Leave blank when it should be omitted or null.
  - type: input
    id: contact
    attributes:
      label: contact
      description: Required public HTTPS URL. Do not provide a private email address.
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: photo
      description: Optional. Leave blank when it should be omitted or null. If provided, link only to a publicly accessible image that you have the right to publish. Do not upload private images here.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I am requesting a listing for myself and approve these facts for public review.
          required: true
        - label: I approve the final listing and copy only after I have reviewed the pull request.
          required: true
        - label: If I provide a photo, I have the right to publish it and approve its use in the directory.
          required: true
        - label: I have read the listing policy and understand that the issue is public.
          required: true
